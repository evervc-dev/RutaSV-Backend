services:
  # Backend API (.NET 10 con Hot Reload)
  rutasv-api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: rutasv-api-dev
    working_dir: /app/src/RutaSV.Api
    volumes:
      - ./:/app
      - ~/.nuget/packages:/root/.nuget/packages
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};Include Error Detail=true
      - MinIO__Endpoint=minio:${MINIO_PORT_API:-9000}
      - MinIO__AccessKey=${MINIO_ROOT_USER}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD}
      - Smtp__Host=mailpit
      - Smtp__Port=${SMTP_PORT:-1025}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
    command: dotnet watch run --non-interactive
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - rutasv-net

  # Motor de Base de Datos
  postgres:
    image: postgres:18-alpine
    container_name: rutasv-postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rutasv-net

  # Almacenamiento de Imágenes
  minio:
    image: minio/minio:latest
    container_name: rutasv-minio
    ports:
      - "${MINIO_PORT_API:-9000}:9000"
      - "${MINIO_PORT_CONSOLE:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - rutasv-net

  # Bandeja de Correo de Prueba: Mailpit (SMTP + Web UI)
  mailpit:
    image: axllent/mailpit:latest
    container_name: rutasv-mailpit
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - rutasv-net

volumes:
  postgres_data:
  minio_data:

networks:
  rutasv-net:
    driver: bridge